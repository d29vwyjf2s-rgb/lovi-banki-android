name: Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK Packages
        run: |
          sdkmanager "platform-tools"
          sdkmanager "build-tools;34.0.0"
          sdkmanager "platforms;android-34"
          sdkmanager "cmdline-tools;latest"

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: "4.3.0"
          use-dotnet: false
          include-templates: true

      - name: Check Godot
        run: godot --version

      - name: Check Android SDK
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          adb version
          sdkmanager --version

      - name: Check project
        run: |
          godot --headless --path . --editor --quit
      - name: Create Android export preset
        run: |
          cat > export_presets.cfg <<'EOF'
          [preset.0]

          name="Android"
          platform="Android"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/LoviBanki.apk"

          [preset.0.options]

          package/unique_name="com.dimas.lovibanki"
          package/name="Lovi Banki"
          version/code=1
          version/name="1.0"
          EOF
                - name: Diagnose Android export
        run: |
          echo "=== JAVA ==="
          java -version

          echo "=== ANDROID SDK ==="
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          adb version
          sdkmanager --list_installed

          echo "=== EXPORT PRESET ==="
          cat export_presets.cfg

          echo "=== GODOT EXPORT LIST ==="
          godot --headless --path . --editor --quit
      - name: Build Android
        run: |
          mkdir -p build
          godot --headless \
            --path . \
            --export-debug "Android" \
            build/LoviBanki.apk

      - name: Check APK
        run: |
          ls -lh build
          test -f build/LoviBanki.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LoviBanki-APK
          path: build/LoviBanki.apk
