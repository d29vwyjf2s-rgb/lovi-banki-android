name: Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: "4.3.0"
          use-dotnet: false
          include-templates: true

      - name: Godot version
        run: godot --version

      - name: Project check
        run: |
          godot --headless --path . --editor --quit

      - name: Show export presets
        run: |
          echo "===== export_presets.cfg ====="
          cat export_presets.cfg
          echo "=============================="

      - name: Build Android APK
        run: |
          mkdir -p build
          godot --headless \
            --path . \
            --export-debug "Android" \
            build/LoviBanki.apk

      - name: APK result
        run: |
          ls -lah build
          test -f build/LoviBanki.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LoviBanki-APK
          path: build/LoviBanki.apk
