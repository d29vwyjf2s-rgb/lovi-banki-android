name: Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: "4.3.0"
          use-dotnet: false
          include-templates: true

      - name: Show Godot version
        run: godot --version

      - name: Import Godot project
        run: |
          godot --headless --path . --editor --quit || true

      - name: Check Android export preset
        run: |
          test -f project.godot
          test -f export_presets.cfg
          echo "Project files found"
          echo "Android preset:"
          grep -A5 -B2 'name="Android"' export_presets.cfg || true

      - name: Create build directory
        run: mkdir -p build

      - name: Build APK
        run: |
          godot --headless \
            --path . \
            --export-release "Android" \
            build/LoviBanki.apk

      - name: Check APK
        run: |
          ls -lh build/
          test -f build/LoviBanki.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LoviBanki-APK
          path: build/LoviBanki.apk
