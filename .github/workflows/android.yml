name: Android Build
on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-34"
          sdkmanager "build-tools;34.0.0"
      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: "4.3.0"
          use-dotnet: false
          include-templates: true
      - name: Check environment
        run: |
          echo "=== JAVA ==="
          java -version
          echo "=== ANDROID SDK ==="
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          adb version
          sdkmanager --list_installed
      - name: Check project
        run: |
          godot --headless --path . --editor --quit
            - name: Create export preset
        run: |
          cat > export_presets.cfg <<'EOF'
          [preset.0]
          name="Android"
          platform="Android"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/LoviBanki.apk"

          [preset.0.options]
          package/unique_name="com.dimas.lovibanki"
          package/name="Lovi Banki"
          version/code=1
          version/name="1.0"
          EOF

          echo "=== EXPORT PRESET ==="
          cat export_presets.cfg
      - name: Diagnose Android export
        run: |
          echo "=== GODOT ==="
          godot --version
          echo "=== PROJECT ==="
          godot --headless --path . --editor --quit
      - name: Build Android
        run: |
          mkdir -p build
          godot --headless \
            --path . \
            --export-debug "Android" \
            build/LoviBanki.apk
      - name: Check APK
        run: |
          ls -lh build
          test -f build/LoviBanki.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LoviBanki-APK
          path: build/LoviBanki.apk
